workflows:
  ios-release:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      node: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.wanderly.fogofwar"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install pnpm & dependencies
        script: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile=false
      - name: Expo Prebuild (Generate iOS Native Project)
        script: |
          cd artifacts/wanderly
          npx expo prebuild --platform ios --clean
      - name: Set up code signing settings on Xcode project
        script: |
          cd artifacts/wanderly/ios
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          cd artifacts/wanderly/ios
          xcode-project build-ipa \
            --workspace "$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)" \
            --scheme "$(find . -maxdepth 1 -name '*.xcworkspace' | sed 's/\.xcworkspace//' | sed 's/^\.\///')" \
            --config Release
    artifacts:
      - artifacts/wanderly/ios/build/remote-build/Build/Products/Release-iphoneos/*.ipa
      - artifacts/wanderly/dist/**/*
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
